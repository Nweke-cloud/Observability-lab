server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:

  - job_name: system
    static_configs:
      - targets:
          - localhost
        labels:
          job: varlogs
          host: docker-host
          __path__: /var/log/*log

  - job_name: app-logs
    static_configs:
      - targets:
          - localhost
        labels:
          job: app-logs
          app: sample-app
          env: production
          __path__: /app-logs/*.log
    pipeline_stages:
      - json:
          expressions:
            level: level
            message: message
            service: service
            duration_ms: duration_ms
      - labels:
          level:
          service:
      - drop:
          expression: ".*healthcheck.*"
          drop_counter_reason: healthcheck_noise

